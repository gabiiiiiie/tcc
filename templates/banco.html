<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title id="titulobanco">Almoxarifado</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="paginabanco">
    <h1 id="titulo">Almoxarifado</h1>

    <!-- CORREÇÃO 1: Coloquei a div container fechando certinho e mudei o ID para "inputPesquisa" para bater com o JavaScript -->
    <div class="container-pesquisa">
        <input type="text" id="inputPesquisa" onkeyup="filtrarTabela()" placeholder="Pesquise por nome do item...">
    </div>

    <!-- Botão de Voltar Corrigido (Redirecionamento limpo para a raiz) -->
    <div style="padding-left: 5%; margin-top: 20px;">
        <button id="consulta_botao" type="button" onclick="window.location.href='/'">Voltar ao Login</button>
    </div>

    <br><br><br>

    <table id="tabelinha">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome do item</th>
                <th>Quantidade</th>
                <th>Estoque Mínimo</th>
                <th>Descrição</th>
                <th>Preco</th>
                <th>Categoria</th>
                <th>Foto</th>
            </tr>
        </thead>
        <tbody>
            {% for item in resposta %}
           
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>{{ item[3] }}</td>
                <td>{{ item[4] }}</td>
                <td>R$ {{ item[5] }}</td>
                <td>{{ item[6] }}</td>
                <td>
                    <img src="{{ url_for('static', filename='imagemitens/' ~ item[7]) }}" alt="{{ item[1] }}" width="100">
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Botão adicionar novos itens -->
    <div style="width: 100%; display: flex; justify-content: flex-start; margin-top: 15px; padding-left: 5%;">
        <button id="adicionaritensbotao" type="button" onclick="window.location.href='/adicionaritens'">
            <svg width="16" height="17" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
            </svg>
            Adicionar Itens
        </button>

        <div style="width: 100%; display: flex; justify-content: flex-start; margin-top: 15px; padding-left: 5%;">
            <button id="botaoatualizar" type="button" onclick="window.location.href='/movimentacao'">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                </svg>
               Atualizar quantidade
            </button>

    </div>


    <script>

      function filtrarTabela() {
        const input = document.getElementById("inputPesquisa");
        const filter = input.value.toLowerCase();
        
        // Busca a tabela especificamente dentro da classe da página
        const tabela = document.querySelector(".paginabanco table");
        if (!tabela) return; 
        
        const linhas = tabela.getElementsByTagName("tr");

        // Começa em 1 para pular o cabeçalho (th)
        for (let i = 1; i < linhas.length; i++) {
            let linhaContemOTexto = false;
            const celulas = linhas[i].getElementsByTagName("td");
            
            // Varre todas as colunas da linha para achar o termo digitado
            for (let j = 0; j < celulas.length; j++) {
                const textoCelula = celulas[j].textContent || celulas[j].innerText;
                if (textoCelula.toLowerCase().indexOf(filter) > -1) {
                    linhaContemOTexto = true;
                    break; 
                }
            }
            
            // Exibe ou oculta a linha de forma dinâmica
            linhas[i].style.display = linhaContemOTexto ? "" : "none";
        }
    }
    </script>

</html>
