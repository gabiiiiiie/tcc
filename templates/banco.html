<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Almoxarifado</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="paginabanco">
    <h1 id="titulo">Almoxarifado</h1>

    <!-- CORREÇÃO 1: Coloquei a div container fechando certinho e mudei o ID para "inputPesquisa" para bater com o JavaScript -->
    <div class="container-pesquisa">
        <input type="text" id="inputPesquisa" onkeyup="filtrarTabela()" placeholder="Pesquise por nome do item...">
    </div>

    <!-- Botão de Voltar Corrigido (Redirecionamento limpo para a raiz) -->
    <div style="padding-left: 5%; margin-top: 20px;">
        <button id="consulta_botao" type="button" onclick="window.location.href='/'">Voltar ao Login</button>
    </div>

    <br><br><br>

    <table id="tabelinha">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome do item</th>
                <th>Quantidade</th>
                <th>Estoque</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Categoria</th>
                <th>Foto</th>
            </tr>
        </thead>
        <tbody>
            {% for item in resposta %}
            <!-- CORREÇÃO 2: Limpados os fechamentos extras de </td> e </tr> que estavam duplicados aqui dentro -->
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>{{ item[3] }}</td>
                <td>{{ item[4] }}</td>
                <td>R$ {{ item[5] }}</td>
                <td>{{ item[6] }}</td>
                <td>
                    <img src="{{ url_for('static', filename='imagemitens/' ~ item[7]) }}" alt="{{ item[1] }}" width="100">
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Botão adicionar novos itens -->
    <div style="width: 100%; display: flex; justify-content: flex-start; margin-top: 15px; padding-left: 5%;">
        <button id="adicionaritensbotao" type="button" onclick="window.location.href='/adicionaritens'">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
            </svg>
            Adicionar Itens
        </button>
    </div>

   <script>
function filtrarTabela() {
    var input = document.getElementById("inputPesquisa");
    var filter = input.value.toLowerCase();
    var tabela = document.getElementById("tabelinha");
    var linhas = tabela.getElementsByTagName("tr");

    for (var i = 1; i < linhas.length; i++) {
        var colunas = linhas[i].getElementsByTagName("td");
        if (colunas.length > 0) {
            var nomeItem = colunas[1].textContent || colunas[1].innerText;
            
            if (nomeItem.toLowerCase().indexOf(filter) > -1) {
                // CORRIGIDO: Removido o ".style" duplicado
                linhas[i].style.display = ""; 
            } else {
                linhas[i].style.display = "none";
            }
        }
    }
}
</script>

</body>
</html>
