<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Almoxarifado</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="paginabanco">
    <h1 id="titulo">Almoxarifado</h1>
    <form action="/" method="GET">
    <a href="/adicionaritens">
        <button id="consulta_botao" type="submit">Voltar ao Login</button>
    </a>
    </form>
<br><br><br><br><br><br><br><br><br>
    <table id="tabelinha">
        <tr>
            <th>Id</th>
            <th>Nome do item</th>
            <th>Quantidade</th>
            <th>Categoria</th>
            <th>Descrição</th>
        </tr>
        {% for item in resposta%}
        <tr>
            <th>{{item[0]}}</th>
            <th>{{item[1]}}</th>
            <th>{{item[2]}}</th>
            <th>{{item[3]}}</th>
            <th>{{item[4]}}</th>
        </tr>
        {% endfor %}
    </table>
   <!-- BOTÃO adicionar novos itens-->
    <div style="width: 100%; display: flex; justify-content: flex-start; margin-top: 15px;">
        <button class="adicionaritensbotao" type="button" onclick="window.location.href='/adicionaritens'" style="background-color: #007acc; color: white; border: none; padding: 10px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
            </svg>
            Adicionar Itens
        </button>
    </div>
</body>
 <a href="/adicionaritens">
        <button id="adicionaritensbotao" type="submit">Adicionar itens</button>
 </a>
</html>
