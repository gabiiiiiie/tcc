<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sucesso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .caixa-sucesso {
            max-width: 400px;
            margin: 100px auto;
            background-color: #004B87;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: #333333;
        }
        .icone-sucesso { font-size: 50px; color: #2ecc71; margin-bottom: 15px; }
        .caixa-sucesso h2 { margin-bottom: 20px; color: #004B87; }
        .btn-voltar {
            display: inline-block; background-color: #007acc; color: white; border: none; 
            padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            text-decoration: none; margin-top: 10px; transition: background 0.2s;
        }
        .btn-voltar:hover { background-color: #005999; }
    </style>
</head>
<body class="paginabanco">
    <div class="caixa-sucesso">
        <div class="icone-sucesso">✓</div>
        <h2>Item Cadastrado com Sucesso!</h2>
        <p>O produto já foi salvo no banco de dados e está visível no almoxarifado.</p>
        <!-- Botão para retornar à página do estoque -->
        <a href="/banco" class="btn-voltar">Voltar para a Tabela</a>
    </div>
</body>
</html>
