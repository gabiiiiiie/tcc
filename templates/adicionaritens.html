<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Itens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      
        .container-cadastro {
            max-width: 500px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            color: #496483;
        }
        .container-cadastro h2 { margin-bottom: 20px; color: #d97736; text-align: center; }
        .form-grupo { margin-bottom: 15px; height: fit-content; }
        .form-grupo label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-grupo input, .form-grupo textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
        }
        .botoes-cadastro { display: flex; gap: 10px; margin-top: 20px; }
        .btn-salvar { background-color: #007acc; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold;}
        .btn-cancelar { background-color: #d97736; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; text-align: center; text-decoration: none;}
    </style>
</head>

<script>
function visualizarFoto() {

    const url = document.getElementById('foto').value.trim();

    if (!url) {
        Swal.fire({
            icon: 'warning',
            title: 'URL não informada',
            text: 'Cole o link da imagem primeiro.'
        });
        return;
    }

    Swal.fire({
        title: 'Visualização da foto',
        html: `
            <div style="
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 200px;
            ">
                <img 
                    src="${url}" 
                    style="
                        max-width: 100%;
                        max-height: 350px;
                        object-fit: contain;
                        border-radius: 10px;
                    "
                    onerror="erroImagem()"
                >
            </div>
        `,
        showCloseButton: true,
        showConfirmButton: false
    });
}

function erroImagem() {

    Swal.close();

    Swal.fire({
        icon: 'error',
        title: 'Não foi possível carregar a imagem',
        text: 'Verifique se o link está correto e aponta diretamente para uma imagem.'
    });
}
</script>

<body class="paginabanco">
    <div class="container-cadastro">
        <h2>Cadastrar Novo Item</h2>
        
       
        <form action="/salvaritem" method="POST">
            <div id="form-grupo">
                <label>Nome do Item:</label>
                <input type="text" name="nome" required>
            </div>
            <div class="form-grupo">
                <label>Quantidade:</label>
                <input type="number" name="quantidade" required>
            </div>
            <div class="form-grupo">
                <label>Estoque Mínimo:</label>
                <input type="number" name="estoque" required>
            </div>
            <div class="form-grupo">
                <label>Descrição:</label>
                <textarea name="descricao" rows="3" required></textarea>
            </div>
            <div class="form-grupo">
                <label>Preco:</label>
                <input type="number" step="0.01" name="preco" required>
            </div>
            <div class="form-grupo">
                <label>Categoria:</label>
                <select id="seleçaouseradmin" name="role" required>
                <option value="" selected disabled>Selecione</option>
                <option value="admin">Elétrica</option>
                <option value="user">Mecânica</option>
                <option value="user">Geral</option>
            </select>
            <div class="form-grupo">
                <br>
    <label>Link da imagem :</label>

    <input 
        type="url" 
        id="foto"
        name="foto" 
        placeholder="https://imagem.com/imagem.jpg"
        required
    >

    <button 
        type="button" 
        onclick="visualizarFoto()"
        style="
            margin-top: 8px;
            background-color: #007acc;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
        "
    >
        Visualizar imagem
    </button>
</div>
                <div class="botoes-cadastro">
    <button type="submit" class="btn-salvar">Salvar Item</button>
    <a href="/banco" class="btn-cancelar">Cancelar</a>
</div>
</body>
</html>
