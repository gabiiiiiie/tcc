<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuários</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 500px;">
        <h2>Cadastrar Novo Usuário</h2>
        <p>Logado como: <strong>{{ session['username'] }} ({{ session['role'] }})</strong></p>
        
        <form action="/cadastrar_usuario" method="POST" class="border p-4 bg-light rounded">
            <div class="mb-3">
                <label class="form-label">Nome de Usuário</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nível de Permissão</label>
                <select name="role" class="form-select" required>
                    <option value="user">Usuário Comum</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Registrar no Banco</button>
            <a href="/banco" class="btn btn-secondary w-100 mt-2">Voltar ao Almoxarifado</a>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'sucesso' else 'danger' }} mt-3">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
